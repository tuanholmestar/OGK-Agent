name: C++ CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            libcurl4-openssl-dev \
            nlohmann-json3-dev \
            libssl-dev \
            python3

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Start mock Ollama server
        shell: bash
        run: |
          python3 tests/mock_server.py > mock_server.log 2>&1 &
          SERVER_PID=$!
          echo "$SERVER_PID" > mock_server.pid

          # Wait until the mock server is listening on 127.0.0.1:8000.
          python3 - <<'PY'
          import socket
          import time

          deadline = time.time() + 30
          while time.time() < deadline:
              try:
                  with socket.create_connection(("127.0.0.1", 8000), timeout=1):
                      print("Mock server is ready.")
                      break
              except OSError:
                  time.sleep(0.5)
          else:
              raise SystemExit("Mock server did not start within 30 seconds.")
          PY

      - name: Run unit and integration tests
        run: ctest --test-dir build --output-on-failure

      - name: Show mock server log on failure
        if: failure()
        run: cat mock_server.log || true

      - name: Stop mock Ollama server
        if: always()
        shell: bash
        run: |
          if [ -f mock_server.pid ]; then
            kill "$(cat mock_server.pid)" 2>/dev/null || true
          fi
